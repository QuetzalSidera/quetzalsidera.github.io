<svg xmlns="http://www.w3.org/2000/svg"
     width="1120"
     height="330"
     viewBox="0 0 1120 330"
     role="img"
     aria-labelledby="title desc">

  <title id="title">IPv4 伪首部格式</title>
  <desc id="desc">
    IPv4伪首部由源地址、目的地址、全零字段、协议号和传输层长度组成。
    UDP协议号为17，TCP协议号为6。伪首部只参与校验，不随报文发送。
  </desc>

  <defs>
    <style>
      text {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .title {
      font-size: 24px;
      font-weight: 700;
      fill: #0f172a;
      }

      .field {
      font-size: 16px;
      font-weight: 650;
      text-anchor: middle;
      }

      .small {
      font-size: 14px;
      font-weight: 500;
      fill: #475569;
      }

      .bit {
      font-size: 13px;
      font-weight: 650;
      fill: #334155;
      }
    </style>
  </defs>

  <rect width="1120" height="330" fill="#f8fafc"/>

  <text x="52" y="44" class="title">
    IPv4 伪首部 · 12 B
  </text>

  <text x="1068" y="43" class="small" text-anchor="end">
    仅参与 UDP/TCP 校验，不随报文发送
  </text>


  <g transform="translate(70 86)">

    <!-- bit 标尺 -->
    <text x="0" y="0" class="bit">0</text>
    <text x="490" y="0" class="bit" text-anchor="end">15</text>
    <text x="510" y="0" class="bit">16</text>
    <text x="980" y="0" class="bit" text-anchor="end">31</text>

    <line x1="0" y1="10"
          x2="980" y2="10"
          stroke="#64748b"
          stroke-width="2"/>

    <line x1="0" y1="5"
          x2="0" y2="15"
          stroke="#64748b"
          stroke-width="2"/>

    <line x1="490" y1="5"
          x2="490" y2="15"
          stroke="#64748b"
          stroke-width="2"/>

    <line x1="510" y1="5"
          x2="510" y2="15"
          stroke="#64748b"
          stroke-width="2"/>

    <line x1="980" y1="5"
          x2="980" y2="15"
          stroke="#64748b"
          stroke-width="2"/>


    <!-- 源地址 -->
    <rect x="0" y="24"
          width="980"
          height="60"
          fill="#ede9fe"
          stroke="#7c3aed"
          stroke-width="2.5"/>

    <text x="490" y="60"
          class="field"
          fill="#5b21b6">
      源 IPv4 地址 · 32 位
    </text>


    <!-- 目的地址 -->
    <rect x="0" y="84"
          width="980"
          height="60"
          fill="#ede9fe"
          stroke="#7c3aed"
          stroke-width="2.5"/>

    <text x="490" y="120"
          class="field"
          fill="#5b21b6">
      目的 IPv4 地址 · 32 位
    </text>


    <!-- 保留/协议/长度 -->
    <rect x="0"
          y="144"
          width="245"
          height="66"
          fill="#f1f5f9"
          stroke="#64748b"
          stroke-width="2.5"/>

    <rect x="245"
          y="144"
          width="245"
          height="66"
          fill="#ffedd5"
          stroke="#ea580c"
          stroke-width="2.5"/>

    <rect x="490"
          y="144"
          width="490"
          height="66"
          fill="#dbeafe"
          stroke="#2563eb"
          stroke-width="2.5"/>


    <text x="122.5"
          y="173"
          class="field"
          fill="#334155">
      全 0 · 8 位
    </text>

    <text x="122.5"
          y="195"
          class="small"
          text-anchor="middle">
      保留字段
    </text>


    <text x="367.5"
          y="173"
          class="field"
          fill="#c2410c">
      协议号 · 8 位
    </text>

    <text x="367.5"
          y="195"
          class="small"
          text-anchor="middle">
      UDP=17（0x11） · TCP=6（0x06）
    </text>


    <text x="735"
          y="173"
          class="field"
          fill="#1d4ed8">
      传输层长度 · 16 位
    </text>

    <text x="735"
          y="195"
          class="small"
          text-anchor="middle">
      TCP/UDP 首部 + 数据长度
    </text>

  </g>

</svg>
