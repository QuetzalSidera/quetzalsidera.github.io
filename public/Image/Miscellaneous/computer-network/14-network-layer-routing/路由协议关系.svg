<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">路由算法与路由协议的关系</title>
  <desc id="desc">动态路由按作用范围分为自治系统内部的 IGP 与自治系统之间的 EGP。RIP 是距离向量 IGP，OSPF 是链路状态 IGP，BGP 是当前使用的路径向量 EGP。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.title{font-size:25px;font-weight:750;fill:#0f172a}.box{font-size:18px;font-weight:750;text-anchor:middle}.sub{font-size:14px;font-weight:550;fill:#475569;text-anchor:middle}.edge{font-size:14px;font-weight:700;fill:#475569;text-anchor:middle}</style></defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="38" y="46" class="title">路由算法解决计算问题，路由协议规定信息如何交换</text>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"><path d="M600 155V215H330V255"/><path d="M600 155V215H870V255"/><path d="M330 355V420H190V470"/><path d="M330 355V420H470V470"/><path d="M870 355V470"/></g>
  <g stroke-width="2.5">
    <rect x="420" y="75" width="360" height="80" fill="#dbeafe" stroke="#2563eb"/><text x="600" y="108" class="box" fill="#1d4ed8">互联网动态路由</text><text x="600" y="134" class="sub">按路由信息的作用范围分层</text>
    <rect x="155" y="255" width="350" height="100" fill="#dcfce7" stroke="#16a34a"/><text x="330" y="294" class="box" fill="#15803d">IGP · 域内路由</text><text x="330" y="322" class="sub">同一自治系统内部 · 追求内部效率</text><text x="330" y="344" class="sub">管理员可自主选择协议</text>
    <rect x="695" y="255" width="350" height="100" fill="#ede9fe" stroke="#7c3aed"/><text x="870" y="294" class="box" fill="#6d28d9">EGP · 域间路由</text><text x="870" y="322" class="sub">自治系统之间 · 可达性与策略优先</text><text x="870" y="344" class="sub">当前协议为 BGP-4</text>

    <rect x="55" y="470" width="270" height="150" fill="#ffedd5" stroke="#ea580c"/><text x="190" y="510" class="box" fill="#c2410c">RIP</text><text x="190" y="540" class="sub">距离向量</text><text x="190" y="565" class="sub">度量：跳数</text><text x="190" y="590" class="sub">UDP 端口 520</text>
    <rect x="335" y="470" width="270" height="150" fill="#fef3c7" stroke="#d97706"/><text x="470" y="510" class="box" fill="#b45309">OSPF</text><text x="470" y="540" class="sub">链路状态</text><text x="470" y="565" class="sub">LSDB + Dijkstra</text><text x="470" y="590" class="sub">直接封装于 IP · 协议号 89</text>
    <rect x="735" y="470" width="270" height="150" fill="#fae8ff" stroke="#a21caf"/><text x="870" y="510" class="box" fill="#86198f">BGP</text><text x="870" y="540" class="sub">路径向量</text><text x="870" y="565" class="sub">AS-PATH + 策略属性</text><text x="870" y="590" class="sub">TCP 端口 179</text>
  </g>
  <g class="edge"><rect x="490" y="190" width="220" height="30" fill="#f8fafc"/><text x="600" y="211">AS 是路由管理边界</text><rect x="215" y="394" width="230" height="30" fill="#f8fafc"/><text x="330" y="415">两类典型最短路径算法</text><rect x="760" y="394" width="220" height="30" fill="#f8fafc"/><text x="870" y="415">策略可覆盖路径长度</text></g>
  <text x="600" y="665" class="sub">RIP 与 OSPF 都是 IGP；BGP 是 EGP。IGP/EGP 描述作用范围，不是算法名称。</text>
</svg>
