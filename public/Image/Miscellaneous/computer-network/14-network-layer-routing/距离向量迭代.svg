<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">距离向量算法的一轮迭代</title>
  <desc id="desc">节点 x 到 y 的链路代价为二，到 z 的链路代价为七，y 到 z 的代价为一。交换距离向量后，x 通过 y 到 z 的代价由七更新为三。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.title{font-size:25px;font-weight:750;fill:#0f172a}.node{font-size:22px;font-weight:750;text-anchor:middle}.cost{font-size:16px;font-weight:750;fill:#334155;text-anchor:middle}.head{font-size:17px;font-weight:750;fill:#1e293b;text-anchor:middle}.cell{font-size:16px;font-weight:650;fill:#334155;text-anchor:middle}.formula{font-size:17px;font-weight:700;fill:#1d4ed8;text-anchor:middle}</style></defs>
  <rect width="1100" height="650" fill="#f8fafc"/>
  <text x="38" y="46" class="title">距离向量：只用直连代价与邻居通告更新本地最短距离</text>
  <g stroke="#64748b" stroke-width="5" fill="none"><path d="M180 210L500 105"/><path d="M500 105L835 225"/><path d="M180 210L835 225"/></g>
  <g fill="#fff" stroke-width="3"><circle cx="180" cy="210" r="46" stroke="#2563eb"/><circle cx="500" cy="105" r="46" stroke="#16a34a"/><circle cx="835" cy="225" r="46" stroke="#ea580c"/></g>
  <text x="180" y="218" class="node" fill="#1d4ed8">x</text><text x="500" y="113" class="node" fill="#15803d">y</text><text x="835" y="233" class="node" fill="#c2410c">z</text><text x="325" y="136" class="cost">2</text><text x="672" y="143" class="cost">1</text><text x="508" y="245" class="cost">7</text>

  <g transform="translate(80 310)"><text x="185" y="0" class="head">x 的初始距离向量</text><rect x="0" y="20" width="370" height="150" fill="#fff" stroke="#94a3b8" stroke-width="2"/><line x1="0" y1="68" x2="370" y2="68" stroke="#cbd5e1"/><line x1="123" y1="20" x2="123" y2="170" stroke="#cbd5e1"/><line x1="246" y1="20" x2="246" y2="170" stroke="#cbd5e1"/><text x="61" y="51" class="head">目的</text><text x="184" y="51" class="head">距离</text><text x="308" y="51" class="head">下一跳</text><text x="61" y="98" class="cell">x</text><text x="184" y="98" class="cell">0</text><text x="308" y="98" class="cell">—</text><text x="61" y="132" class="cell">y</text><text x="184" y="132" class="cell">2</text><text x="308" y="132" class="cell">y</text><text x="61" y="162" class="cell">z</text><text x="184" y="162" class="cell">7</text><text x="308" y="162" class="cell">z</text></g>
  <path d="M480 420H620" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="550" y="398" class="cost">收到 D_y(z)=1</text>
  <g transform="translate(650 310)"><text x="185" y="0" class="head">x 更新后的距离向量</text><rect x="0" y="20" width="370" height="150" fill="#fff" stroke="#94a3b8" stroke-width="2"/><line x1="0" y1="68" x2="370" y2="68" stroke="#cbd5e1"/><line x1="123" y1="20" x2="123" y2="170" stroke="#cbd5e1"/><line x1="246" y1="20" x2="246" y2="170" stroke="#cbd5e1"/><text x="61" y="51" class="head">目的</text><text x="184" y="51" class="head">距离</text><text x="308" y="51" class="head">下一跳</text><text x="61" y="98" class="cell">x</text><text x="184" y="98" class="cell">0</text><text x="308" y="98" class="cell">—</text><text x="61" y="132" class="cell">y</text><text x="184" y="132" class="cell">2</text><text x="308" y="132" class="cell">y</text><text x="61" y="162" class="cell">z</text><text x="184" y="162" class="cell" fill="#1d4ed8">3</text><text x="308" y="162" class="cell" fill="#1d4ed8">y</text></g>
  <g transform="translate(80 525)"><rect width="940" height="78" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="470" y="32" class="formula">D_x(z) = min { c(x,y)+D_y(z), c(x,z)+D_z(z) } = min { 2+1, 7+0 } = 3</text><text x="470" y="59" class="cost">距离改变后，x 再把新距离向量通告给直接邻居；反复迭代直到收敛</text></g>
</svg>
