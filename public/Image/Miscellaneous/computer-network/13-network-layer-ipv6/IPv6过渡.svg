<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">IPv6 的双协议栈与隧道过渡</title>
  <desc id="desc">双协议栈节点根据目的地址选择 IPv4 或 IPv6；IPv6 over IPv4 隧道在入口将完整 IPv6 数据报封装进 IPv4 数据报，在出口解封装。</desc>
  <defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.title{font-size:24px;font-weight:750;fill:#0f172a}.heading{font-size:19px;font-weight:750;fill:#1e293b}.box{font-size:17px;font-weight:750;text-anchor:middle}.sub{font-size:14px;font-weight:550;fill:#475569;text-anchor:middle}</style></defs>
  <rect width="1120" height="620" fill="#f8fafc"/>
  <text x="40" y="45" class="title">IPv4 与 IPv6 的渐进过渡</text>
  <text x="55" y="95" class="heading">双协议栈</text>
  <g stroke-width="2.5"><rect x="55" y="118" width="250" height="130" fill="#e0f2fe" stroke="#0284c7"/><rect x="435" y="118" width="250" height="130" fill="#f1f5f9" stroke="#64748b"/><rect x="815" y="118" width="250" height="130" fill="#e0f2fe" stroke="#0284c7"/></g>
  <text x="180" y="157" class="box" fill="#075985">双栈主机 A</text><text x="180" y="188" class="sub">IPv4 地址 + IPv6 地址</text><text x="180" y="217" class="sub">A / AAAA 提供候选</text><text x="560" y="157" class="box">网络路径</text><text x="560" y="188" class="sub">A / AAAA 提供地址候选</text><text x="560" y="217" class="sub">地址选择 + 可达性后连接</text><text x="940" y="157" class="box" fill="#075985">双栈主机 B</text><text x="940" y="188" class="sub">分别处理两类数据报</text>
  <path d="M305 164H435M685 164H815" stroke="#7c3aed" stroke-width="4" marker-end="url(#purple)"/><path d="M305 214H435M685 214H815" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>

  <line x1="55" y1="285" x2="1065" y2="285" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="330" class="heading">IPv6 over IPv4 隧道</text>
  <g stroke-width="2.5"><rect x="55" y="355" width="190" height="105" fill="#dbeafe" stroke="#2563eb"/><rect x="290" y="355" width="190" height="105" fill="#ede9fe" stroke="#7c3aed"/><rect x="525" y="355" width="190" height="105" fill="#f1f5f9" stroke="#64748b"/><rect x="760" y="355" width="190" height="105" fill="#ede9fe" stroke="#7c3aed"/><rect x="995" y="355" width="70" height="105" fill="#dbeafe" stroke="#2563eb"/></g>
  <text x="150" y="397" class="box" fill="#1d4ed8">IPv6 网络</text><text x="150" y="429" class="sub">原 IPv6 数据报</text><text x="385" y="397" class="box" fill="#6d28d9">隧道入口</text><text x="385" y="429" class="sub">封装 IPv4 首部</text><text x="620" y="397" class="box">IPv4 网络</text><text x="620" y="429" class="sub">按外层 IPv4 转发</text><text x="855" y="397" class="box" fill="#6d28d9">隧道出口</text><text x="855" y="429" class="sub">去除 IPv4 首部</text><text x="1030" y="397" class="box" fill="#1d4ed8">IPv6</text>
  <path d="M245 408H290M480 408H525M715 408H760M950 408H995" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
  <g transform="translate(300 500)"><rect width="520" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect width="150" height="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="75" y="33" class="box" fill="#6d28d9">IPv4 首部</text><text x="75" y="55" class="sub">外层</text><text x="335" y="42" class="box" fill="#1d4ed8">完整 IPv6 数据报 · 内层</text></g>
</svg>
