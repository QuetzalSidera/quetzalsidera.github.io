<svg xmlns="http://www.w3.org/2000/svg" width="980" height="570" viewBox="0 0 980 570" role="img" aria-labelledby="title desc">
  <title id="title">网络负载与吞吐量</title>
  <desc id="desc">网络负载较低时吞吐量随负载近似线性增加，接近容量后增长放缓；严重拥塞时重传和排队消耗资源，吞吐量可能下降并发生拥塞崩溃。</desc>
  <defs>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.title{font-size:24px;font-weight:750;fill:#0f172a}.axis{font-size:17px;font-weight:700;fill:#334155}.label{font-size:15px;font-weight:650;fill:#475569}.strong{font-size:16px;font-weight:750}</style>
  </defs>
  <rect width="980" height="570" fill="#f8fafc"/>
  <text x="42" y="45" class="title">拥塞：负载继续增加，吞吐量不再同比增长</text>
  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#axis)"><path d="M105 480V82"/><path d="M105 480H910"/></g>
  <text x="45" y="78" class="axis">吞吐量</text><text x="846" y="522" class="axis">提供负载</text>
  <path d="M108 476C250 398 350 310 470 220C565 150 650 144 710 177C772 211 817 290 872 387" fill="none" stroke="#2563eb" stroke-width="8"/>
  <path d="M108 476L710 108" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="470" y1="220" x2="470" y2="480" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="710" y1="177" x2="710" y2="480" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="470" cy="220" r="9" fill="#f59e0b"/><circle cx="710" cy="177" r="9" fill="#dc2626"/>
  <g class="strong"><text x="238" y="397" fill="#15803d">非拥塞区</text><text x="470" y="198" fill="#b45309" text-anchor="middle">膝点</text><text x="622" y="127" fill="#b45309" text-anchor="middle">拥塞区</text><text x="803" y="278" fill="#b91c1c" text-anchor="middle">拥塞崩溃</text></g>
  <g class="label"><text x="287" y="454">吞吐量近似随负载增长</text><text x="599" y="205">排队时延迅速增加</text><text x="804" y="333">丢包与重传消耗容量</text><text x="652" y="82">虚线：无排队与丢包时的理想关系</text></g>
  <g transform="translate(130 505)"><rect width="640" height="42" fill="#fff" stroke="#cbd5e1"/><text x="320" y="27" class="label" text-anchor="middle">拥塞判断看变化趋势：负载增加而吞吐量增长很小，甚至下降</text></g>
</svg>
