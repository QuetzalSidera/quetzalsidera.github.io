<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">非持续连接串行传输时序</title>
  <desc id="desc">基础 HTML 与每个引用对象分别使用一条 TCP 连接。不同连接使用独立时序面板，并按上下行串行排列。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#16a34a"/>
    </marker>

    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      .message-label { paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1100" height="900" rx="28" fill="#f8fafc"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="40" y="55" fill="#0f172a" font-size="26" font-weight="700">非持续连接 · 串行</text>
    <text x="1060" y="54" fill="#64748b" font-size="16" text-anchor="end">每个对象使用一条独立 TCP 连接</text>

    <rect x="55" y="85" width="990" height="330" rx="22" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>
    <text x="85" y="112" fill="#1d4ed8" font-size="19" font-weight="700">第 1 行 · TCP 连接 0 · 基础 HTML</text>
    <g fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">
      <text x="300" y="138">客户端 0</text>
      <text x="780" y="138">服务器 0</text>
    </g>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="300" y1="148" x2="300" y2="382" marker-end="url(#arrow)"/>
      <line x1="780" y1="148" x2="780" y2="382" marker-end="url(#arrow)"/>
    </g>

    <g fill="none" stroke-width="2.5">
      <path d="M300 155 780 195" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M780 195 300 235" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M300 235 780 275" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
    </g>
    <g class="message-label" font-size="15" font-weight="700" text-anchor="middle">
      <text x="540" y="166" fill="#475569">SYN</text>
      <text x="540" y="222" fill="#475569">SYN-ACK</text>
      <text x="540" y="252" fill="#1d4ed8">ACK + GET 基础 HTML</text>
    </g>
    <g filter="url(#shadow)">
      <path d="M780 275 780 325 300 365 300 315Z" fill="#bfdbfe"/>
    </g>
    <path d="M780 275 300 315" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text class="message-label" x="470" y="300" fill="#1d4ed8" font-size="15" font-weight="700" text-anchor="middle">响应首字节到达</text>
    <text x="540" y="325" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="middle">基础 HTML 数据</text>

    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M175 155 H150 V235 H175"/>
      <path d="M175 235 H150 V315 H175"/>
      <path d="M800 275 H825 V325 H800" stroke="#2563eb"/>
    </g>
    <g font-size="15" font-weight="700">
      <text x="135" y="200" fill="#475569" text-anchor="end">1 RTT</text>
      <text x="135" y="280" fill="#475569" text-anchor="end">1 RTT</text>
      <text x="845" y="304" fill="#1d4ed8">D₀ = L₀/R</text>
    </g>
    <text x="282" y="389" fill="#1d4ed8" font-size="15" font-weight="700" text-anchor="end">完整到达并解析</text>

    <path d="M300 397 V445" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-blue)"/>
    <text x="325" y="432" fill="#1d4ed8" font-size="14" font-weight="700">解析完成后才开始下一条连接</text>

    <rect x="55" y="450" width="990" height="330" rx="22" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>
    <text x="85" y="477" fill="#6d28d9" font-size="19" font-weight="700">第 i + 1 行 · TCP 连接 i · 引用对象 i</text>
    <g fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">
      <text x="300" y="503">客户端 i</text>
      <text x="780" y="503">服务器 i</text>
    </g>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="300" y1="513" x2="300" y2="747" marker-end="url(#arrow)"/>
      <line x1="780" y1="513" x2="780" y2="747" marker-end="url(#arrow)"/>
    </g>

    <g fill="none" stroke-width="2.5">
      <path d="M300 520 780 560" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M780 560 300 600" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M300 600 780 640" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
    </g>
    <g class="message-label" font-size="15" font-weight="700" text-anchor="middle">
      <text x="540" y="531" fill="#475569">SYN</text>
      <text x="540" y="587" fill="#475569">SYN-ACK</text>
      <text x="540" y="617" fill="#6d28d9">ACK + GET 引用对象 i</text>
    </g>
    <g filter="url(#shadow)">
      <path d="M780 640 780 690 300 730 300 680Z" fill="#ddd6fe"/>
    </g>
    <path d="M780 640 300 680" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <text class="message-label" x="470" y="665" fill="#6d28d9" font-size="15" font-weight="700" text-anchor="middle">响应首字节到达</text>
    <text x="540" y="690" fill="#6d28d9" font-size="17" font-weight="700" text-anchor="middle">引用对象 i 数据</text>

    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M175 520 H150 V600 H175"/>
      <path d="M175 600 H150 V680 H175"/>
      <path d="M800 640 H825 V690 H800" stroke="#7c3aed"/>
    </g>
    <g font-size="15" font-weight="700">
      <text x="135" y="565" fill="#475569" text-anchor="end">1 RTT</text>
      <text x="135" y="645" fill="#475569" text-anchor="end">1 RTT</text>
      <text x="845" y="669" fill="#6d28d9">Dᵢ = Lᵢ/R</text>
    </g>
    <text x="282" y="754" fill="#6d28d9" font-size="15" font-weight="700" text-anchor="end">完整对象 i 到达</text>

    <text x="550" y="810" fill="#475569" font-size="15" font-weight="600" text-anchor="middle">其余引用对象继续使用独立连接，并按新的行依次排列</text>
    <g transform="translate(330 835)">
      <rect width="440" height="42" rx="21" fill="#e2e8f0"/>
      <text x="220" y="27" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">总时延：2(N + 1)RTT + ΣDᵢ</text>
    </g>
  </g>
</svg>
