<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">持续连接非流水线传输时序</title>
  <desc id="desc">客户端只建立一次 TCP 连接，完整接收基础 HTML 后，在同一连接上逐一请求引用对象；每个后续请求必须等待前一对象完整到达。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#16a34a"/>
    </marker>

    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      .message-label { paint-order: stroke; stroke: #f8fafc; stroke-width: 6px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1100" height="900" rx="28" fill="#f8fafc"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="40" y="55" fill="#0f172a" font-size="26" font-weight="700">持续连接 · 非流水线</text>
    <text x="1060" y="54" fill="#64748b" font-size="16" text-anchor="end">一条 TCP 连接 · 时间向下</text>

    <g fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle">
      <text x="300" y="96">客户端</text>
      <text x="800" y="96">服务器</text>
    </g>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="300" y1="110" x2="300" y2="830" marker-end="url(#arrow)"/>
      <line x1="800" y1="110" x2="800" y2="830" marker-end="url(#arrow)"/>
    </g>

    <g fill="none" stroke-width="2.5">
      <path d="M300 130 800 180" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M800 180 300 230" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M300 230 800 280" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
    </g>
    <g class="message-label" font-size="16" font-weight="600">
      <text x="520" y="140" fill="#475569">SYN</text>
      <text x="520" y="215" fill="#475569">SYN-ACK</text>
      <text x="485" y="245" fill="#1d4ed8">ACK + GET 基础 HTML</text>
    </g>
    <g filter="url(#shadow)">
      <path d="M800 280 800 335 300 385 300 330Z" fill="#bfdbfe" fill-opacity=".85"/>
    </g>
    <path d="M800 280 300 330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text class="message-label" x="450" y="303" fill="#1d4ed8" font-size="15" font-weight="700">基础 HTML 首字节到达</text>
    <text x="550" y="352" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="middle">基础 HTML 数据</text>
    <path d="M820 280 H845 V335 H820" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="880" y="311" fill="#1d4ed8" font-size="16" font-weight="700">D₀ = L₀/R</text>

    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M165 130 H145 V230 H165"/>
      <path d="M165 230 H145 V330 H165"/>
    </g>
    <g fill="#475569" font-size="16" font-weight="700" text-anchor="end">
      <text x="130" y="185">1 RTT</text>
      <text x="130" y="285">1 RTT</text>
    </g>
    <text x="282" y="407" fill="#1d4ed8" font-size="15" font-weight="700" text-anchor="end">完整到达并解析</text>

    <line x1="210" y1="430" x2="890" y2="430" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="550" y="453" fill="#64748b" font-size="15" font-weight="600" text-anchor="middle">连接保持打开；不再进行 TCP 握手</text>

    <path d="M300 475 800 525" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <g filter="url(#shadow)">
      <path d="M800 525 800 580 300 630 300 575Z" fill="#ddd6fe" fill-opacity=".9"/>
    </g>
    <path d="M800 525 300 575" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <text class="message-label" x="520" y="492" fill="#6d28d9" font-size="16" font-weight="700">GET 引用对象 1</text>
    <text class="message-label" x="440" y="548" fill="#6d28d9" font-size="15" font-weight="700">对象 1 首字节到达</text>
    <text x="550" y="582" fill="#6d28d9" font-size="17" font-weight="700" text-anchor="middle">对象 1 数据</text>
    <path d="M820 525 H845 V580 H820" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <text x="880" y="556" fill="#6d28d9" font-size="16" font-weight="700">D₁ = L₁/R</text>
    <path d="M165 475 H145 V575 H165" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="130" y="530" fill="#475569" font-size="16" font-weight="700" text-anchor="end">1 RTT</text>
    <text x="282" y="650" fill="#6d28d9" font-size="15" font-weight="700" text-anchor="end">对象 1 完整到达</text>

    <text x="550" y="656" fill="#64748b" font-size="22" font-weight="700" text-anchor="middle">⋮</text>

    <path d="M300 680 800 730" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <g filter="url(#shadow)">
      <path d="M800 730 800 780 300 830 300 780Z" fill="#bbf7d0" fill-opacity=".9"/>
    </g>
    <path d="M800 730 300 780" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text class="message-label" x="520" y="697" fill="#15803d" font-size="16" font-weight="700">GET 引用对象 N</text>
    <text class="message-label" x="440" y="753" fill="#15803d" font-size="15" font-weight="700">对象 N 首字节到达</text>
    <text x="550" y="785" fill="#15803d" font-size="17" font-weight="700" text-anchor="middle">对象 N 数据</text>
    <path d="M820 730 H845 V780 H820" fill="none" stroke="#16a34a" stroke-width="2"/>
    <text x="880" y="761" fill="#15803d" font-size="16" font-weight="700">Dₙ = Lₙ/R</text>
    <path d="M165 680 H145 V780 H165" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="130" y="735" fill="#475569" font-size="16" font-weight="700" text-anchor="end">1 RTT</text>

    <g transform="translate(330 845)">
      <rect width="440" height="38" rx="19" fill="#e2e8f0"/>
      <text x="220" y="25" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">总时延：(N + 2)RTT + ΣDᵢ</text>
    </g>
  </g>
</svg>
