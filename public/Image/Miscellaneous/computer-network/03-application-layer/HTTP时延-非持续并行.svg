<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">非持续连接固定批次并行传输时序</title>
  <desc id="desc">基础 HTML 使用一条独立 TCP 连接；解析完成后，同一批的连接 1 到连接 K 各用独立时序面板，并排在同一行并行执行。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#16a34a"/>
    </marker>

    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      .message-label { paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1100" height="900" rx="28" fill="#f8fafc"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="40" y="55" fill="#0f172a" font-size="26" font-weight="700">非持续连接 · 并行</text>
    <text x="1060" y="54" fill="#64748b" font-size="16" text-anchor="end">不同连接使用不同时间线</text>

    <rect x="55" y="85" width="990" height="325" rx="22" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>
    <text x="85" y="122" fill="#1d4ed8" font-size="19" font-weight="700">第 1 行 · TCP 连接 0 · 基础 HTML</text>
    <g fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">
      <text x="300" y="138">客户端 0</text>
      <text x="780" y="138">服务器 0</text>
    </g>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="300" y1="148" x2="300" y2="378" marker-end="url(#arrow)"/>
      <line x1="780" y1="148" x2="780" y2="378" marker-end="url(#arrow)"/>
    </g>
    <g fill="none" stroke-width="2.5">
      <path d="M300 155 780 195" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M780 195 300 235" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M300 235 780 275" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
    </g>
    <g filter="url(#shadow)">
      <path d="M780 275 780 325 300 365 300 315Z" fill="#bfdbfe"/>
    </g>
    <path d="M780 275 300 315" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <g class="message-label" font-size="15" font-weight="700" text-anchor="middle">
      <text x="540" y="166" fill="#475569">SYN</text>
      <text x="540" y="222" fill="#475569">SYN-ACK</text>
      <text x="540" y="252" fill="#1d4ed8">ACK + GET 基础 HTML</text>
      <text x="470" y="300" fill="#1d4ed8">响应首字节到达</text>
    </g>
    <text x="540" y="325" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="middle">基础 HTML 数据</text>
    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M175 155 H150 V235 H175"/>
      <path d="M175 235 H150 V315 H175"/>
      <path d="M800 275 H825 V325 H800" stroke="#2563eb"/>
    </g>
    <g font-size="15" font-weight="700">
      <text x="135" y="200" fill="#475569" text-anchor="end">1 RTT</text>
      <text x="135" y="280" fill="#475569" text-anchor="end">1 RTT</text>
      <text x="845" y="304" fill="#1d4ed8">D₀ = L₀/R</text>
    </g>
    <text x="282" y="389" fill="#1d4ed8" font-size="15" font-weight="700" text-anchor="end">完整到达并解析</text>

    <path d="M300 397 V432 H550" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-blue)"/>
    <text x="575" y="437" fill="#1d4ed8" font-size="15" font-weight="700">解析后，同批至多 K 条连接同时开始</text>

    <rect x="55" y="455" width="450" height="325" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="595" y="455" width="450" height="325" rx="22" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <text x="80" y="490" fill="#6d28d9" font-size="18" font-weight="700">TCP 连接 1</text>
    <text x="620" y="490" fill="#15803d" font-size="18" font-weight="700">TCP 连接 K</text>
    <text x="550" y="620" fill="#64748b" font-size="30" font-weight="700" text-anchor="middle">…</text>

    <g fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">
      <text x="170" y="516">客户端 1</text>
      <text x="405" y="516">服务器 1</text>
      <text x="710" y="516">客户端 K</text>
      <text x="945" y="516">服务器 K</text>
    </g>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="170" y1="526" x2="170" y2="755" marker-end="url(#arrow)"/>
      <line x1="405" y1="526" x2="405" y2="755" marker-end="url(#arrow)"/>
      <line x1="710" y1="526" x2="710" y2="765" marker-end="url(#arrow)"/>
      <line x1="945" y1="526" x2="945" y2="765" marker-end="url(#arrow)"/>
    </g>

    <g fill="none" stroke-width="2.25">
      <path d="M170 535 405 575" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M405 575 170 615" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M170 615 405 655" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
      <path d="M710 535 945 575" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M945 575 710 615" stroke="#475569" marker-end="url(#arrow)"/>
      <path d="M710 615 945 655" stroke="#16a34a" marker-end="url(#arrow-green)"/>
    </g>
    <g filter="url(#shadow)">
      <path d="M405 655 405 695 170 735 170 695Z" fill="#ddd6fe"/>
      <path d="M945 655 945 715 710 755 710 695Z" fill="#bbf7d0"/>
    </g>
    <path d="M405 655 170 695" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <path d="M945 655 710 695" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>

    <g class="message-label" font-size="13" font-weight="700" text-anchor="middle">
      <text x="287" y="546" fill="#475569">SYN</text>
      <text x="287" y="603" fill="#475569">SYN-ACK</text>
      <text x="287" y="632" fill="#6d28d9">ACK + GET 1</text>
      <text x="245" y="684" fill="#6d28d9">对象 1 首字节</text>
      <text x="827" y="546" fill="#475569">SYN</text>
      <text x="827" y="603" fill="#475569">SYN-ACK</text>
      <text x="827" y="632" fill="#15803d">ACK + GET K</text>
      <text x="785" y="684" fill="#15803d">对象 K 首字节</text>
    </g>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <text x="287" y="702" fill="#6d28d9">对象 1 数据</text>
      <text x="827" y="712" fill="#15803d">对象 K 数据</text>
    </g>

    <g fill="none" stroke-width="2">
      <path d="M92 535 H72 V615 H92" stroke="#64748b"/>
      <path d="M92 615 H72 V695 H92" stroke="#64748b"/>
      <path d="M632 535 H612 V615 H632" stroke="#64748b"/>
      <path d="M632 615 H612 V695 H632" stroke="#64748b"/>
      <path d="M525 655 H545 V755 H525" stroke="#475569"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="65" y="580" fill="#475569" text-anchor="end">1 RTT</text>
      <text x="65" y="660" fill="#475569" text-anchor="end">1 RTT</text>
      <text x="605" y="580" fill="#475569" text-anchor="end">1 RTT</text>
      <text x="605" y="660" fill="#475569" text-anchor="end">1 RTT</text>
      <text x="570" y="710" fill="#475569" text-anchor="middle">D(Bⱼ)</text>
    </g>

    <line x1="65" y1="790" x2="1035" y2="790" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="550" y="815" fill="#475569" font-size="15" font-weight="600" text-anchor="middle">D(Bⱼ) = Σ Lᵢ/R · 本批全部完成后进入下一批 · 共 ⌈N/K⌉ 批 · Σrᵢ ≤ R</text>

    <g transform="translate(275 835)">
      <rect width="550" height="42" rx="21" fill="#e2e8f0"/>
      <text x="275" y="27" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">总时延：2RTT + 2⌈N/K⌉RTT + ΣDᵢ</text>
    </g>
  </g>
</svg>
