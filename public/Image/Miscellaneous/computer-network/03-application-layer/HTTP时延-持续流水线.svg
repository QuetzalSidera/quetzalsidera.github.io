<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 1.1 持续连接流水线时序</title>
  <desc id="desc">客户端在一条持续连接上连续发送引用对象请求；服务器必须按请求顺序发送完整响应。每个对象由一个首字节箭头和一块连续数据阴影表示。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#16a34a"/>
    </marker>

    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      .message-label { paint-order: stroke; stroke: #f8fafc; stroke-width: 6px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1100" height="900" rx="28" fill="#f8fafc"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="40" y="55" fill="#0f172a" font-size="26" font-weight="700">持续连接 · HTTP/1.1 流水线</text>
    <text x="1060" y="54" fill="#64748b" font-size="16" text-anchor="end">完整响应按请求顺序发送</text>

    <g fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle">
      <text x="300" y="96">客户端</text>
      <text x="800" y="96">服务器</text>
    </g>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="300" y1="110" x2="300" y2="830" marker-end="url(#arrow)"/>
      <line x1="800" y1="110" x2="800" y2="830" marker-end="url(#arrow)"/>
    </g>

    <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M300 130 800 180"/>
      <path d="M800 180 300 230"/>
    </g>
    <path d="M300 230 800 280" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <g class="message-label" fill="#475569" font-size="16" font-weight="600">
      <text x="520" y="140">SYN</text>
      <text x="520" y="215">SYN-ACK</text>
      <text x="485" y="245" fill="#1d4ed8">ACK + GET 基础 HTML</text>
    </g>
    <g filter="url(#shadow)">
      <path d="M800 280 800 335 300 385 300 330Z" fill="#bfdbfe" fill-opacity=".85"/>
    </g>
    <path d="M800 280 300 330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text class="message-label" x="450" y="303" fill="#1d4ed8" font-size="15" font-weight="700">基础 HTML 首字节到达</text>
    <text x="550" y="340" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="middle">基础 HTML 数据</text>
    <path d="M820 280 H845 V335 H820" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="880" y="311" fill="#1d4ed8" font-size="16" font-weight="700">D₀ = L₀/R</text>

    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M165 130 H145 V230 H165"/>
      <path d="M165 230 H145 V330 H165"/>
    </g>
    <g fill="#475569" font-size="16" font-weight="700" text-anchor="end">
      <text x="130" y="185">1 RTT</text>
      <text x="130" y="285">1 RTT</text>
    </g>
    <text x="282" y="407" fill="#1d4ed8" font-size="15" font-weight="700" text-anchor="end">完整到达并解析</text>

    <line x1="210" y1="430" x2="890" y2="430" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="550" y="453" fill="#64748b" font-size="15" font-weight="600" text-anchor="middle">完整请求连续发送，允许多个请求同时处于未决状态</text>

    <g fill="none" stroke-width="2.5">
      <path d="M300 475 800 520" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
      <path d="M300 487 800 532" stroke="#ea580c" marker-end="url(#arrow-orange)"/>
      <path d="M300 499 800 544" stroke="#16a34a" marker-end="url(#arrow-green)"/>
    </g>
    <g class="message-label" font-size="15" font-weight="700" text-anchor="middle">
      <text x="550" y="488" fill="#6d28d9">GET 1</text>
      <text x="550" y="506" fill="#c2410c">GET 2</text>
      <text x="550" y="524" fill="#15803d">… GET N</text>
    </g>

    <g filter="url(#shadow)">
      <path d="M800 525 800 575 300 625 300 575Z" fill="#ddd6fe"/>
      <path d="M800 575 800 635 300 685 300 625Z" fill="#fed7aa"/>
      <path d="M800 635 800 695 300 745 300 685Z" fill="#bbf7d0"/>
    </g>
    <g fill="none" stroke-width="3">
      <path d="M800 525 300 575" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
      <path d="M800 575 300 625" stroke="#ea580c" marker-end="url(#arrow-orange)"/>
      <path d="M800 635 300 685" stroke="#16a34a" marker-end="url(#arrow-green)"/>
    </g>
    <g class="message-label" font-size="14" font-weight="700">
      <text x="400" y="552" fill="#6d28d9">对象 1 首字节</text>
      <text x="400" y="602" fill="#c2410c">对象 2 首字节</text>
      <text x="400" y="662" fill="#15803d">对象 N 首字节</text>
    </g>
    <g font-size="17" font-weight="700" text-anchor="middle">
      <text x="550" y="582" fill="#6d28d9">对象 1 数据</text>
      <text x="550" y="637" fill="#c2410c">对象 2 数据</text>
      <text x="550" y="697" fill="#15803d">对象 N 数据</text>
    </g>

    <path d="M820 525 H845 V575 H820" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <path d="M820 575 H845 V635 H820" fill="none" stroke="#ea580c" stroke-width="2"/>
    <path d="M820 635 H845 V695 H820" fill="none" stroke="#16a34a" stroke-width="2"/>
    <g font-size="15" font-weight="700">
      <text x="880" y="555" fill="#6d28d9">D₁</text>
      <text x="880" y="610" fill="#c2410c">D₂</text>
      <text x="880" y="670" fill="#15803d">Dₙ</text>
    </g>

    <path d="M165 475 H145 V575 H165" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="130" y="530" fill="#475569" font-size="16" font-weight="700" text-anchor="end">1 RTT</text>

    <g transform="translate(365 782)">
      <text x="185" y="22" fill="#9a3412" font-size="15" font-weight="600" text-anchor="middle">响应不能交错：前序大对象会阻塞后续响应</text>
    </g>
    <text x="550" y="834" fill="#475569" font-size="15" font-weight="600" text-anchor="middle">每个对象均为“一个首字节箭头 + 一块连续阴影”，并按请求顺序排列</text>

    <g transform="translate(355 850)">
      <rect width="390" height="36" rx="18" fill="#e2e8f0"/>
      <text x="195" y="24" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">总时延：3RTT + ΣDᵢ</text>
    </g>
  </g>
</svg>
