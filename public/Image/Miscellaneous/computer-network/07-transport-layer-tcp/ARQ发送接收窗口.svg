<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ARQ 发送与接收窗口</title>
  <desc id="desc">按序累计确认且发送窗口已填满的简化快照。发送方和接收方分别使用一行离散报文格；数据箭头从发送方指向接收方，确认箭头反向。报文一、二已确认；三、四已被接收端确认但发送端尚未收到确认；五至七已经发送但接收端尚未确认；八以后尚未发送。</desc>

  <defs>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-ack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-pointer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .endpoint { font-size: 18px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .packet { font-size: 17px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .region { font-size: 12px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .boundary { font-size: 14px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .note { font-size: 14px; font-weight: 550; fill: #475569; }
      .arrow-note { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .bracket { fill: none; stroke-width: 2.5; }
      .clear { paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="38" y="42" class="title">ARQ 发送与接收窗口</text>
  <text x="1162" y="41" class="note" text-anchor="end">序号空间局部展开 · 时间状态快照</text>

  <rect x="30" y="70" width="1140" height="580" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <g transform="translate(760 98)" class="note">
    <path d="M0 0V22" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-data)"/>
    <text x="14" y="17">DATA</text>
    <path d="M100 22V0" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-ack)"/>
    <text x="114" y="17">ACK</text>
    <path d="M215 22V0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-pointer)"/>
    <text x="229" y="17">端点指针</text>
  </g>

  <text x="76" y="198" class="endpoint">发送方</text>
  <text x="76" y="508" class="endpoint">接收方</text>

  <path d="M315 151V133H747V151" class="bracket" stroke="#2563eb"/>
  <text x="531" y="124" class="boundary clear" fill="#1d4ed8">发送窗口 [send_begin, send_end]</text>

  <g stroke-width="2">
    <rect x="135" y="165" width="72" height="58" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="225" y="165" width="72" height="58" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="315" y="165" width="72" height="58" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="405" y="165" width="72" height="58" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="495" y="165" width="72" height="58" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="585" y="165" width="72" height="58" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="675" y="165" width="72" height="58" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="765" y="165" width="72" height="58" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="7 5"/>
    <rect x="855" y="165" width="72" height="58" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="7 5"/>
    <rect x="945" y="165" width="72" height="58" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="7 5"/>
  </g>
  <g class="packet">
    <text x="171" y="190">1</text><text x="171" y="211" class="region">区域 1</text>
    <text x="261" y="190">2</text><text x="261" y="211" class="region">区域 1</text>
    <text x="351" y="190">3</text><text x="351" y="211" class="region">区域 2</text>
    <text x="441" y="190">4</text><text x="441" y="211" class="region">区域 2</text>
    <text x="531" y="190">5</text><text x="531" y="211" class="region">区域 3</text>
    <text x="621" y="190">6</text><text x="621" y="211" class="region">区域 3</text>
    <text x="711" y="190">7</text><text x="711" y="211" class="region">区域 3</text>
    <text x="801" y="190">8</text><text x="801" y="211" class="region">区域 4</text>
    <text x="891" y="190">9</text><text x="891" y="211" class="region">区域 4</text>
    <text x="981" y="190">10</text><text x="981" y="211" class="region">区域 4</text>
  </g>

  <g class="boundary clear">
    <text x="351" y="104">send_begin</text>
    <text x="711" y="104">send_end</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-pointer)">
    <path d="M351 110V165"/>
    <path d="M711 110V165"/>
  </g>

  <!-- 区域 1：DATA 与 ACK 均完成 -->
  <g fill="none" stroke-linecap="round">
    <path d="M162 223V470" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-data)"/>
    <path d="M252 223V470" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-data)"/>
    <path d="M180 470V223" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-ack)"/>
    <path d="M270 470V223" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-ack)"/>

    <!-- 区域 2：DATA 已到达，ACK 尚未到达发送方 -->
    <path d="M342 223V470" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-data)"/>
    <path d="M432 223V470" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-data)"/>
    <path d="M360 470V304" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-ack)"/>
    <path d="M450 470V304" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-ack)"/>

    <!-- 区域 3：DATA 已发送，接收方尚未确认 -->
    <path d="M522 223V338" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-data)"/>
    <path d="M612 223V360" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-data)"/>
    <path d="M702 223V382" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-data)"/>
  </g>

  <text x="216" y="350" class="arrow-note clear" fill="#334155">DATA 与 ACK 均完成</text>
  <text x="405" y="403" class="arrow-note clear" fill="#6d28d9">确认尚未到达发送方</text>
  <text x="620" y="316" class="arrow-note clear" fill="#1d4ed8">DATA 已发送，尚未确认</text>
  <text x="890" y="350" class="arrow-note clear" fill="#64748b">尚未发送</text>

  <g stroke-width="2">
    <rect x="135" y="470" width="72" height="58" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="225" y="470" width="72" height="58" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="315" y="470" width="72" height="58" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="405" y="470" width="72" height="58" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="495" y="470" width="72" height="58" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="585" y="470" width="72" height="58" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="675" y="470" width="72" height="58" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="765" y="470" width="72" height="58" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="855" y="470" width="72" height="58" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="945" y="470" width="72" height="58" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="7 5"/>
  </g>
  <g class="packet">
    <text x="171" y="495">1</text><text x="171" y="516" class="region">已接收</text>
    <text x="261" y="495">2</text><text x="261" y="516" class="region">已接收</text>
    <text x="351" y="495">3</text><text x="351" y="516" class="region">已接收</text>
    <text x="441" y="495">4</text><text x="441" y="516" class="region">已接收</text>
    <text x="531" y="495">5</text><text x="531" y="516" class="region">可接收</text>
    <text x="621" y="495">6</text><text x="621" y="516" class="region">可接收</text>
    <text x="711" y="495">7</text><text x="711" y="516" class="region">可接收</text>
    <text x="801" y="495">8</text><text x="801" y="516" class="region">可接收</text>
    <text x="891" y="495">9</text><text x="891" y="516" class="region">可接收</text>
    <text x="981" y="495">10</text><text x="981" y="516" class="region">窗口外</text>
  </g>

  <g class="boundary clear">
    <text x="531" y="617">recv_begin</text>
    <text x="891" y="617">recv_end</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-pointer)">
    <path d="M531 604V528"/>
    <path d="M891 604V528"/>
  </g>

  <path d="M495 542V560H927V542" class="bracket" stroke="#16a34a"/>
  <text x="711" y="578" class="boundary clear" fill="#15803d">接收窗口 [recv_begin, recv_end]</text>

  <text x="600" y="644" class="note" text-anchor="middle">简化快照：序号未回绕、按序累计确认，且发送窗口已经填满</text>
</svg>
