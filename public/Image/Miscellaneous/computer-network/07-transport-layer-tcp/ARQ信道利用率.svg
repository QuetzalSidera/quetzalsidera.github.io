<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">ARQ 信道利用率</title>
  <desc id="desc">在无丢失、忽略处理与排队时延的模型中，停止等待发送一个分组后等待确认，周期为数据传输时延 T D 加往返时延 RTT 加确认传输时延 T A。窗口大小 N 为四的流水线可在 N T D 内连续发送四个分组，因此利用率上限为一，且等于 N T D 除以停等周期与一的较小值。</desc>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 25px; font-weight: 750; fill: #0f172a; }
      .panel { font-size: 21px; font-weight: 750; fill: #0f172a; }
      .endpoint { font-size: 15px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .small { font-size: 13px; font-weight: 550; fill: #475569; }
      .measure { font-size: 14px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .formula { font-size: 18px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1500" height="780" fill="#f8fafc"/>
  <text x="30" y="42" class="title">ARQ 信道利用率：停等与流水线</text>
  <text x="1470" y="41" class="small" text-anchor="end">时间向下 · 无丢失 · 忽略处理与排队时延</text>

  <!-- 停止等待 -->
  <g>
    <rect x="24" y="70" width="702" height="608" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="48" y="108" class="panel">停止等待</text>
    <text x="190" y="145" class="endpoint">发送端</text>
    <text x="595" y="145" class="endpoint">接收端</text>
    <line x1="190" y1="165" x2="190" y2="585" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
    <line x1="595" y1="165" x2="595" y2="585" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>

    <path d="M190 190V240L595 340V290Z" fill="#dbeafe" fill-opacity="0.8" stroke="#2563eb" stroke-width="2.2"/>
    <line x1="190" y1="190" x2="595" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="390" y="244" class="label" fill="#1d4ed8">DATA</text>
    <text x="609" y="315" class="small">T<tspan baseline-shift="sub" font-size="10">D</tspan> 内收完</text>

    <path d="M595 340V360L190 460V440Z" fill="#ede9fe" fill-opacity="0.85" stroke="#7c3aed" stroke-width="2.2"/>
    <line x1="595" y1="340" x2="190" y2="440" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="390" y="395" class="label" fill="#6d28d9">ACK</text>

    <path d="M158 190H140V240H158" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="118" y="215" class="measure" transform="rotate(-90 118 215)">T<tspan baseline-shift="sub" font-size="10">D</tspan></text>
    <path d="M158 240H140V440H158" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="118" y="340" class="measure" transform="rotate(-90 118 340)">RTT</text>
    <path d="M158 440H140V460H158" fill="none" stroke="#ea580c" stroke-width="2.5"/>
    <text x="118" y="450" class="measure" transform="rotate(-90 118 450)">T<tspan baseline-shift="sub" font-size="10">A</tspan></text>

    <path d="M96 190H74V460H96" fill="none" stroke="#334155" stroke-width="2.7"/>
    <text x="48" y="325" class="measure" transform="rotate(-90 48 325)">发送周期 T<tspan baseline-shift="sub" font-size="10">D</tspan> + RTT + T<tspan baseline-shift="sub" font-size="10">A</tspan></text>

    <rect x="174" y="190" width="32" height="50" fill="#2563eb"/>
    <rect x="174" y="240" width="32" height="220" fill="#e2e8f0"/>
    <text x="224" y="548" class="small">蓝色为发送时间；其余周期等待 ACK，发送链路空闲</text>
    <text x="375" y="626" class="formula">U<tspan baseline-shift="sub" font-size="13">stop</tspan> = T<tspan baseline-shift="sub" font-size="13">D</tspan> / (T<tspan baseline-shift="sub" font-size="13">D</tspan> + RTT + T<tspan baseline-shift="sub" font-size="13">A</tspan>)</text>
    <text x="375" y="654" class="small" text-anchor="middle">每个周期只传输一个数据分组</text>
  </g>

  <!-- N=4 流水线 -->
  <g>
    <rect x="750" y="70" width="726" height="608" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="774" y="108" class="panel">流水线（N = 4）</text>
    <text x="930" y="145" class="endpoint">发送端</text>
    <text x="1340" y="145" class="endpoint">接收端</text>
    <line x1="930" y1="165" x2="930" y2="585" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
    <line x1="1340" y1="165" x2="1340" y2="585" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>

    <path d="M930 190V230L1340 330V290Z" fill="#dbeafe" fill-opacity="0.8" stroke="#2563eb" stroke-width="2"/>
    <path d="M930 230V270L1340 370V330Z" fill="#ede9fe" fill-opacity="0.8" stroke="#7c3aed" stroke-width="2"/>
    <path d="M930 270V310L1340 410V370Z" fill="#ffedd5" fill-opacity="0.8" stroke="#ea580c" stroke-width="2"/>
    <path d="M930 310V350L1340 450V410Z" fill="#dcfce7" fill-opacity="0.8" stroke="#16a34a" stroke-width="2"/>
    <g class="label">
      <text x="1135" y="260" fill="#1d4ed8">D0</text>
      <text x="1135" y="300" fill="#6d28d9">D1</text>
      <text x="1135" y="340" fill="#c2410c">D2</text>
      <text x="1135" y="380" fill="#15803d">D3</text>
    </g>

    <path d="M1340 330L930 450" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
    <path d="M1340 370L930 490" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-gray)"/>
    <path d="M1340 410L930 530" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-gray)"/>
    <path d="M1340 450L930 570" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-gray)"/>
    <g class="small" text-anchor="end">
      <text x="1328" y="342" fill="#1d4ed8">A0</text>
      <text x="1328" y="382" fill="#6d28d9">A1</text>
      <text x="1328" y="422" fill="#c2410c">A2</text>
      <text x="1328" y="462" fill="#15803d">A3</text>
    </g>

    <rect x="914" y="190" width="32" height="40" fill="#2563eb"/>
    <rect x="914" y="230" width="32" height="40" fill="#7c3aed"/>
    <rect x="914" y="270" width="32" height="40" fill="#ea580c"/>
    <rect x="914" y="310" width="32" height="40" fill="#16a34a"/>
    <rect x="914" y="350" width="32" height="100" fill="#e2e8f0"/>

    <path d="M898 190H878V350H898" fill="none" stroke="#334155" stroke-width="2.7"/>
    <text x="854" y="270" class="measure" transform="rotate(-90 854 270)">N T<tspan baseline-shift="sub" font-size="10">D</tspan> = 4 T<tspan baseline-shift="sub" font-size="10">D</tspan></text>
    <path d="M832 190H812V450H832" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <text x="788" y="320" class="measure" transform="rotate(-90 788 320)">T<tspan baseline-shift="sub" font-size="10">D</tspan> + RTT + T<tspan baseline-shift="sub" font-size="10">A</tspan></text>

    <text x="1113" y="626" class="formula">U<tspan baseline-shift="sub" font-size="13">pipe</tspan> = min(1, N T<tspan baseline-shift="sub" font-size="13">D</tspan> / (T<tspan baseline-shift="sub" font-size="13">D</tspan> + RTT + T<tspan baseline-shift="sub" font-size="13">A</tspan>))</text>
    <text x="1113" y="654" class="small" text-anchor="middle">N T<tspan baseline-shift="sub" font-size="10">D</tspan> 覆盖整个周期时，发送方可持续忙碌，U = 1</text>
  </g>

  <path d="M250 720H1250" stroke="#94a3b8" stroke-width="2"/>
  <text x="750" y="752" class="small" text-anchor="middle">传输时延 = 分组长度 / 链路速率；RTT 在此表示往返传播时间，ACK 自身的传输时延另记为 T<tspan baseline-shift="sub" font-size="10">A</tspan>。</text>
</svg>
