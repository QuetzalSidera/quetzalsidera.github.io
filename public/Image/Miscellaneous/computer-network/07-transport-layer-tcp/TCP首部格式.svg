<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">TCP 首部格式</title>
  <desc id="desc">TCP 首部按三十二位分行。固定部分为二十字节，包含端口、序号、确认号、数据偏移、保留位、URG、ACK、PSH、RST、SYN、FIN、窗口、校验和与紧急指针；选项和填充最多四十字节，因此首部总长二十至六十字节。</desc>

  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .field { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 13px; font-weight: 550; fill: #475569; text-anchor: middle; }
      .bit { font-size: 13px; font-weight: 650; fill: #475569; }
      .flag { font-size: 12px; font-weight: 750; fill: #9f1239; text-anchor: middle; }
      .measure { font-size: 14px; font-weight: 650; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="38" y="42" class="title">TCP 首部</text>
  <text x="1162" y="41" class="bit" text-anchor="end">每行 32 位（4 B）</text>

  <g class="bit">
    <text x="140" y="76">0</text>
    <text x="246" y="76">4</text>
    <text x="414" y="76">10</text>
    <text x="582" y="76">16</text>
    <text x="1036" y="76" text-anchor="end">31</text>
  </g>
  <path d="M140 83H1036M140 78V88M252 78V88M420 78V88M588 78V88M1036 78V88" fill="none" stroke="#64748b" stroke-width="2"/>

  <g stroke-width="2.2">
    <rect x="140" y="94" width="448" height="62" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="588" y="94" width="448" height="62" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="364" y="123" class="field" fill="#1d4ed8">源端口</text>
    <text x="364" y="146" class="sub">16 位</text>
    <text x="812" y="123" class="field" fill="#6d28d9">目的端口</text>
    <text x="812" y="146" class="sub">16 位</text>

    <rect x="140" y="156" width="896" height="62" fill="#dcfce7" stroke="#16a34a"/>
    <text x="588" y="185" class="field" fill="#15803d">序号（Sequence Number）</text>
    <text x="588" y="208" class="sub">32 位：本报文段数据第一个字节的序号</text>

    <rect x="140" y="218" width="896" height="62" fill="#ffedd5" stroke="#ea580c"/>
    <text x="588" y="247" class="field" fill="#c2410c">确认号（Acknowledgment Number）</text>
    <text x="588" y="270" class="sub">32 位：期望接收的下一个字节序号</text>

    <rect x="140" y="280" width="112" height="62" fill="#e0f2fe" stroke="#0284c7"/>
    <rect x="252" y="280" width="168" height="62" fill="#f1f5f9" stroke="#64748b"/>
    <rect x="420" y="280" width="28" height="62" fill="#ffe4e6" stroke="#e11d48"/>
    <rect x="448" y="280" width="28" height="62" fill="#ffe4e6" stroke="#e11d48"/>
    <rect x="476" y="280" width="28" height="62" fill="#ffe4e6" stroke="#e11d48"/>
    <rect x="504" y="280" width="28" height="62" fill="#ffe4e6" stroke="#e11d48"/>
    <rect x="532" y="280" width="28" height="62" fill="#ffe4e6" stroke="#e11d48"/>
    <rect x="560" y="280" width="28" height="62" fill="#ffe4e6" stroke="#e11d48"/>
    <rect x="588" y="280" width="448" height="62" fill="#fef3c7" stroke="#d97706"/>
    <text x="196" y="305" class="field" fill="#0369a1">数据偏移</text>
    <text x="196" y="329" class="sub">4 位</text>
    <text x="336" y="305" class="field">保留</text>
    <text x="336" y="329" class="sub">6 位</text>
    <g class="flag">
      <text x="434" y="316" transform="rotate(-90 434 316)">URG</text>
      <text x="462" y="316" transform="rotate(-90 462 316)">ACK</text>
      <text x="490" y="316" transform="rotate(-90 490 316)">PSH</text>
      <text x="518" y="316" transform="rotate(-90 518 316)">RST</text>
      <text x="546" y="316" transform="rotate(-90 546 316)">SYN</text>
      <text x="574" y="316" transform="rotate(-90 574 316)">FIN</text>
    </g>
    <text x="812" y="309" class="field" fill="#b45309">接收窗口</text>
    <text x="812" y="332" class="sub">16 位，单位为字节</text>

    <rect x="140" y="342" width="448" height="62" fill="#fae8ff" stroke="#a21caf"/>
    <rect x="588" y="342" width="448" height="62" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="364" y="371" class="field" fill="#86198f">校验和</text>
    <text x="364" y="394" class="sub">16 位</text>
    <text x="812" y="371" class="field" fill="#0f766e">紧急指针</text>
    <text x="812" y="394" class="sub">16 位，URG = 1 时有效</text>

    <rect x="140" y="404" width="896" height="80" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="8 5"/>
    <text x="588" y="438" class="field">选项 + 填充</text>
    <text x="588" y="464" class="sub">0～40 B；填充后首部长度为 32 位字的整数倍</text>

    <rect x="140" y="484" width="896" height="72" fill="#ffffff" stroke="#94a3b8"/>
    <text x="588" y="517" class="field">应用数据</text>
    <text x="588" y="542" class="sub">不属于 TCP 首部</text>
  </g>

  <path d="M128 94H108V404H128" fill="none" stroke="#334155" stroke-width="2.5"/>
  <text x="82" y="249" class="measure" transform="rotate(-90 82 249)">固定部分 20 B</text>

  <path d="M1048 94H1068V484H1048" fill="none" stroke="#334155" stroke-width="2.5"/>
  <text x="1094" y="289" class="measure" transform="rotate(90 1094 289)">TCP 首部 20～60 B</text>

  <text x="140" y="590" class="bit">数据偏移的值为 5～15，表示 TCP 首部占用的 32 位字数。</text>
  <text x="140" y="618" class="bit">图中按经典格式展示 6 个控制位：URG、ACK、PSH、RST、SYN、FIN。</text>
</svg>
