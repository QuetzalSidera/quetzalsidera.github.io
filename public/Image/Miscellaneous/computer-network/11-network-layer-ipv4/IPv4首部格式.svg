<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">IPv4 数据报首部格式</title>
  <desc id="desc">IPv4 首部按三十二位分行，固定部分为二十字节，包含版本、首部长度、区分服务、总长度、标识、标志、片偏移、生存时间、协议、首部校验和、源地址和目的地址，之后可有选项与填充。</desc>
  <defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.title{font-size:25px;font-weight:750;fill:#0f172a}.field{font-size:16px;font-weight:700;text-anchor:middle}.sub{font-size:13px;font-weight:550;fill:#475569;text-anchor:middle}.bit{font-size:13px;font-weight:650;fill:#475569}.measure{font-size:14px;font-weight:700;fill:#334155;text-anchor:middle}</style></defs>
  <rect width="1200" height="690" fill="#f8fafc"/>
  <text x="38" y="44" class="title">IPv4 数据报首部</text><text x="1158" y="43" class="bit" text-anchor="end">每行 32 位（4 B）</text>
  <g class="bit"><text x="140" y="78">0</text><text x="252" y="78">4</text><text x="364" y="78">8</text><text x="588" y="78">16</text><text x="1036" y="78" text-anchor="end">31</text></g>
  <path d="M140 85H1036M140 80V90M252 80V90M364 80V90M588 80V90M1036 80V90" fill="none" stroke="#64748b" stroke-width="2"/>
  <g stroke-width="2.2">
    <rect x="140" y="96" width="112" height="64" fill="#dbeafe" stroke="#2563eb"/><rect x="252" y="96" width="112" height="64" fill="#e0f2fe" stroke="#0284c7"/><rect x="364" y="96" width="224" height="64" fill="#dcfce7" stroke="#16a34a"/><rect x="588" y="96" width="448" height="64" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="196" y="125" class="field" fill="#1d4ed8">版本</text><text x="196" y="149" class="sub">4 位</text><text x="308" y="125" class="field" fill="#0369a1">IHL</text><text x="308" y="149" class="sub">4 位 · 4 B</text><text x="476" y="125" class="field" fill="#15803d">区分服务</text><text x="476" y="149" class="sub">DSCP 6 位 + ECN 2 位</text><text x="812" y="125" class="field" fill="#6d28d9">总长度</text><text x="812" y="149" class="sub">16 位 · 单位 1 B</text>

    <rect x="140" y="160" width="448" height="64" fill="#ffedd5" stroke="#ea580c"/><rect x="588" y="160" width="84" height="64" fill="#ffe4e6" stroke="#e11d48"/><rect x="672" y="160" width="364" height="64" fill="#fef3c7" stroke="#d97706"/>
    <text x="364" y="189" class="field" fill="#c2410c">标识</text><text x="364" y="213" class="sub">16 位 · 同一原数据报的各片相同</text><text x="630" y="189" class="field" fill="#be123c">标志</text><text x="630" y="213" class="sub">3 位</text><text x="854" y="189" class="field" fill="#b45309">片偏移</text><text x="854" y="213" class="sub">13 位 · 单位 8 B</text>

    <rect x="140" y="224" width="224" height="64" fill="#ccfbf1" stroke="#0f766e"/><rect x="364" y="224" width="224" height="64" fill="#fae8ff" stroke="#a21caf"/><rect x="588" y="224" width="448" height="64" fill="#f1f5f9" stroke="#64748b"/>
    <text x="252" y="253" class="field" fill="#0f766e">生存时间 TTL</text><text x="252" y="277" class="sub">8 位 · 每跳减 1</text><text x="476" y="253" class="field" fill="#86198f">协议</text><text x="476" y="277" class="sub">8 位 · TCP=6 · UDP=17</text><text x="812" y="253" class="field" fill="#334155">首部校验和</text><text x="812" y="277" class="sub">16 位 · 仅覆盖 IPv4 首部</text>

    <rect x="140" y="288" width="896" height="64" fill="#dbeafe" stroke="#2563eb"/><text x="588" y="317" class="field" fill="#1d4ed8">源 IPv4 地址</text><text x="588" y="341" class="sub">32 位</text>
    <rect x="140" y="352" width="896" height="64" fill="#ede9fe" stroke="#7c3aed"/><text x="588" y="381" class="field" fill="#6d28d9">目的 IPv4 地址</text><text x="588" y="405" class="sub">32 位</text>
    <rect x="140" y="416" width="896" height="82" fill="#fff" stroke="#64748b" stroke-dasharray="8 5"/><text x="588" y="451" class="field">选项 + 填充</text><text x="588" y="478" class="sub">0～40 B；填充到 4 B 的整数倍</text>
    <rect x="140" y="498" width="896" height="76" fill="#fff" stroke="#94a3b8"/><text x="588" y="532" class="field">数据</text><text x="588" y="558" class="sub">不属于 IPv4 首部</text>
  </g>
  <path d="M128 96H108V416H128" fill="none" stroke="#334155" stroke-width="2.5"/><text x="82" y="256" class="measure" transform="rotate(-90 82 256)">固定部分 20 B</text>
  <path d="M1048 96H1068V498H1048" fill="none" stroke="#334155" stroke-width="2.5"/><text x="1094" y="297" class="measure" transform="rotate(90 1094 297)">IPv4 首部 20～60 B</text>
  <g class="bit"><text x="140" y="615">IHL 的取值为 5～15，表示首部占用的 32 位字数；总长度的最大值为 65 535 B。</text><text x="140" y="647">分片只改变与分片相关的字段；路由器还会修改 TTL 并重新计算首部校验和。</text></g>
</svg>
