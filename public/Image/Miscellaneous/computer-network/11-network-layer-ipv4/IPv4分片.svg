<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">IPv4 分片与二次分片</title>
  <desc id="desc">总长度四千字节的数据报经过 MTU 为一千五百字节的链路后分成三个片，片偏移分别为零、一百八十五和三百七十；中间片再次分片时，子片偏移在父片 Base 上累加。</desc>
  <defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.title{font-size:25px;font-weight:750;fill:#0f172a}.heading{font-size:18px;font-weight:750;fill:#1e293b}.field{font-size:15px;font-weight:700;text-anchor:middle}.small{font-size:13px;font-weight:550;fill:#475569;text-anchor:middle}.note{font-size:14px;font-weight:650;fill:#334155}</style></defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="40" y="46" class="title">IPv4 分片：每个片都是独立的数据报</text>
  <text x="60" y="91" class="heading">原数据报 · 总长度 4000 B · 首部 20 B · 数据 3980 B · ID=777 · DF=0 · MF=0</text>
  <g transform="translate(60 112)" stroke-width="2.5"><rect width="1080" height="70" fill="#dbeafe" stroke="#2563eb"/><rect width="100" height="70" fill="#ede9fe" stroke="#7c3aed"/><text x="50" y="34" class="field" fill="#6d28d9">首部</text><text x="50" y="56" class="small">20 B</text><text x="590" y="42" class="field" fill="#1d4ed8">数据 3980 B</text></g>
  <text x="60" y="225" class="heading">链路 MTU=1500 B → 非末片最多携带 1480 B 数据</text>
  <g transform="translate(60 250)" stroke-width="2.5">
    <rect width="500" height="82" fill="#dbeafe" stroke="#2563eb"/><rect width="86" height="82" fill="#ede9fe" stroke="#7c3aed"/><text x="43" y="36" class="field" fill="#6d28d9">20 B</text><text x="293" y="37" class="field" fill="#1d4ed8">数据 1480 B</text><text x="293" y="63" class="small">ID=777 · MF=1 · offset=0</text>
    <rect x="560" width="500" height="82" fill="#dcfce7" stroke="#16a34a"/><rect x="560" width="86" height="82" fill="#ede9fe" stroke="#7c3aed"/><text x="603" y="36" class="field" fill="#6d28d9">20 B</text><text x="810" y="37" class="field" fill="#15803d">数据 1480 B</text><text x="810" y="63" class="small">ID=777 · MF=1 · offset=185</text>
    <rect y="112" width="365" height="82" fill="#ffedd5" stroke="#ea580c"/><rect y="112" width="86" height="82" fill="#ede9fe" stroke="#7c3aed"/><text x="43" y="148" class="field" fill="#6d28d9">20 B</text><text x="226" y="149" class="field" fill="#c2410c">数据 1020 B</text><text x="226" y="175" class="small">ID=777 · MF=0 · offset=370</text>
  </g>
  <text x="60" y="485" class="heading">二次分片：第二片进入 MTU=820 B 的链路</text>
  <text x="60" y="515" class="note">父片 Base=185；每个非末子片最多携带 800 B 数据。</text>
  <g transform="translate(60 540)" stroke-width="2.5">
    <rect width="520" height="90" fill="#dcfce7" stroke="#16a34a"/><rect width="90" height="90" fill="#ede9fe" stroke="#7c3aed"/><text x="45" y="41" class="field" fill="#6d28d9">20 B</text><text x="305" y="38" class="field" fill="#15803d">子片数据 800 B</text><text x="305" y="66" class="small">offset=185+0=185 · MF=1</text>
    <rect x="560" width="460" height="90" fill="#fef3c7" stroke="#d97706"/><rect x="560" width="90" height="90" fill="#ede9fe" stroke="#7c3aed"/><text x="605" y="41" class="field" fill="#6d28d9">20 B</text><text x="835" y="38" class="field" fill="#b45309">子片数据 680 B</text><text x="835" y="66" class="small">offset=185+800/8=285 · MF=1</text>
  </g>
  <g transform="translate(60 665)"><rect width="1080" height="58" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="540" y="24" class="note" text-anchor="middle">子片偏移 = 父片 Base + 子片数据在父片中的起始字节数 ÷ 8</text><text x="540" y="46" class="small">最后一个子片继承父片 MF；父片 MF=1，因此这里两个子片的 MF 都为 1</text></g>
</svg>
